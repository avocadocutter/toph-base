name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/dashboard/pnpm-lock.yaml

      - name: Install API deps
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        working-directory: apps/api
        run: pnpm tsc --noEmit

      - name: Typecheck dashboard
        working-directory: apps/dashboard
        run: pnpm tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint API
        working-directory: apps/api
        run: pnpm lint
      - name: Lint dashboard
        working-directory: apps/dashboard
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install API deps
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: apps/api
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: toph_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          JWT_PLATFORM_SECRET: test-secret-that-is-at-least-32-characters-long
          ADMIN_PASSWORD: AdminPassword1
        run: pnpm test -- --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/dashboard/pnpm-lock.yaml

      - name: Install API deps
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Install dashboard deps
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Build dashboard
        working-directory: apps/dashboard
        run: pnpm build
